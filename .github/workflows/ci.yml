name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Stage 1 (Fowler's "commit build"): fast — just proves the app compiles
  # (catches type errors, bad imports, etc.) with no server ever started.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Stage 2 (Fowler's "secondary build"): slower — actually starts the
  # compiled server and proves it serves a request. A successful build
  # above doesn't prove that: it's exactly how this project's "builds fine,
  # crashes at runtime" vue/Nitro export-resolution bug slipped through
  # before. Only runs if the fast stage already passed.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # app.vue SSR-fetches /profile, /skills, /social-links, /experiences
      # on every page, and the homepage specifically does
      # `profileStore.profile.name.split(' ')` — so /profile needs a real
      # `name` string, not just an empty object, or the page 500s on a
      # TypeError before it ever reaches the bundling bug this test exists
      # to catch. The other endpoints are only ever rendered as lists, so
      # an empty array is enough.
      - name: Start stub backend
        run: |
          node -e "
            require('http').createServer((req, res) => {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              if (req.url.includes('/profile')) {
                res.end(JSON.stringify({
                  name: 'CI Stub', shortName: 'Stub', role: 'Tester',
                  roleAlternatives: [], tagline: '', bio: '', bioExtended: '',
                  availableForWork: false, email: '', location: '',
                  avatarUrl: '', cvUrl: '',
                }));
              } else {
                res.end('[]');
              }
            }).listen(5229);
          " &

      - name: Smoke test the built server
        run: |
          node .output/server/index.mjs &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server responded successfully."
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond in time."
          kill $SERVER_PID
          exit 1

  # Stage 3: publish the tested image. Only runs when a `v*` tag is pushed —
  # a deliberate release action, not every merge to main (Continuous
  # Delivery, not full Continuous Deployment).
  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagged with the release version itself — the VPS's docker-compose.yml
      # pins to this exact tag, not `latest`.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-frontend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-frontend:latest

  # Stage 4: deploy. Writes frontend.env fresh from GitHub Secrets every
  # time and only touches the `frontend` service — doesn't sync
  # docker-compose.prod.yml (backend's deploy owns that) and doesn't race
  # with backend's own deploy, since they touch different services.
  deploy:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Write frontend.env and restart the frontend service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cat > ~/portfolio/frontend.env << 'ENVEOF'
            NUXT_PUBLIC_API_BASE=${{ secrets.NUXT_PUBLIC_API_BASE }}
            NUXT_PUBLIC_SITE_URL=${{ secrets.NUXT_PUBLIC_SITE_URL }}
            ENVEOF
            cd ~/portfolio
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export FRONTEND_VERSION=${{ github.ref_name }}
            # Compose still parses every service in the file even when the
            # command only targets `frontend` — API_VERSION must resolve to
            # SOMETHING valid or the whole command fails on an invalid image
            # reference for the untouched api service. "latest" is a
            # harmless placeholder: it's never actually pulled or run here.
            export API_VERSION=latest
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d frontend

      - name: Verify the deployment is healthy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/ > /dev/null; then
                echo "Deployment healthy."
                exit 0
              fi
              sleep 2
            done
            echo "Deployment did not become healthy in time."
            exit 1
